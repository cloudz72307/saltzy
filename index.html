<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saltzy</title>
    <style>
        :root {
            --bg: #0c0f1d;
            --surface: #151931;
            --surface-hover: #1e2447;
            --border: #252d58;
            --text: #e2e8f0;
            --text-dim: #8b9bb4;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Structure */
        aside {
            width: 240px;
            background-color: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 14px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 18px;
        }

        .brand-logo {
            font-size: 22px;
            background: var(--surface-hover);
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 6px;
            color: var(--text-dim);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            width: 100%;
            transition: background 0.15s, color 0.15s;
        }

        .menu-btn:hover {
            background-color: var(--surface-hover);
            color: var(--text);
        }

        .menu-btn.active {
            background-color: var(--accent);
            color: #fff;
        }

        .sidebar-info {
            font-size: 11px;
            color: var(--text-dim);
            border-top: 1px solid var(--border);
            padding-top: 12px;
            text-align: center;
        }

        /* Main Canvas Layout */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .view-panel {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 24px;
            overflow-y: auto;
        }

        .view-panel.active {
            display: flex;
        }

        .panel-heading {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        /* Game Layout */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
        }

        .game-tile {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.15s, transform 0.15s;
        }

        .game-tile:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .tile-icon {
            height: 100px;
            background-color: var(--surface-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .tile-details {
            padding: 12px;
        }

        .tile-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .tile-desc {
            font-size: 12px;
            color: var(--text-dim);
        }

        /* In-App Game Frame View */
        #game-runtime {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        #game-runtime.active {
            display: flex;
        }

        .runtime-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .runtime-back {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .runtime-back:hover {
            border-color: var(--text-dim);
        }

        .runtime-frame-box {
            flex-grow: 1;
            background: #000;
        }

        .runtime-frame-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Browser Proxy Panel */
        .proxy-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .proxy-input {
            flex-grow: 1;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text);
            font-size: 13px;
            outline: none;
        }

        .proxy-input:focus {
            border-color: var(--accent);
        }

        .proxy-submit {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 0 16px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            font-size: 13px;
        }

        .proxy-submit:hover {
            background-color: var(--accent-hover);
        }

        .proxy-screen {
            flex-grow: 1;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
        }

        .proxy-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
    </style>
</head>
<body onload="initProxy()">

    <!-- Sidebar Navigation -->
    <aside>
        <div>
            <div class="brand">
                <div class="brand-logo">🧂</div>
                <div class="brand-name">Saltzy</div>
            </div>
            <div class="menu">
                <button class="menu-btn active" onclick="changeTab('games')">🎮 Games</button>
                <button class="menu-btn" onclick="changeTab('proxy')">🌐 Browser Proxy</button>
            </div>
        </div>
        <div class="sidebar-info">
            Scramjet Enabled
        </div>
    </aside>

    <!-- Main Workspace -->
    <main>
        <!-- Games Grid View -->
        <div id="view-games" class="view-panel active">
            <div class="panel-heading">Games Library</div>
            <div class="games-grid">
                <div class="game-tile" onclick="launchGame('Deltarune', 'https://mollomm1.github.io/test/')">
                    <div class="tile-icon">❤️</div>
                    <div class="tile-details">
                        <div class="tile-title">Deltarune</div>
                        <div class="tile-desc">Web Port</div>
                    </div>
                </div>
                <div class="game-tile" onclick="launchGame('Slope', 'https://slopeonlinegame.github.io/')">
                    <div class="tile-icon">🟢</div>
                    <div class="tile-details">
                        <div class="tile-title">Slope</div>
                        <div class="tile-desc">Classic 3D Runner</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Embedded Game Player View -->
        <div id="game-runtime">
            <div class="runtime-toolbar">
                <div id="runtime-title" style="font-size: 14px; font-weight: 500;">Playing</div>
                <button class="runtime-back" onclick="exitGame()">← Exit Game</button>
            </div>
            <div class="runtime-frame-box">
                <iframe id="runtime-iframe" src="about:blank"></iframe>
            </div>
        </div>

        <!-- Browser Proxy View -->
        <div id="view-proxy" class="view-panel">
            <div class="panel-heading">Web Proxy</div>
            <div class="proxy-bar">
                <input type="text" id="proxy-url" class="proxy-input" value="https://www.google.com" placeholder="Search or enter URL...">
                <button class="proxy-submit" onclick="executeProxy()">Load</button>
            </div>
            <div class="proxy-screen">
                <iframe id="proxy-iframe" src="about:blank"></iframe>
            </div>
        </div>
    </main>

    <script>
        const scramjetBase = "https://cloudz72307-abc-learning-time.hf.space/";

        function initProxy() {
            // Automatically queue Google as the initial default load state
            document.getElementById('proxy-url').value = "https://www.google.com";
            document.getElementById('proxy-iframe').src = scramjetBase + "https://www.google.com";
        }

        function changeTab(target) {
            document.getElementById('game-runtime').classList.remove('active');
            
            document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));

            if (target === 'games') {
                document.querySelector('.menu-btn:nth-child(1)').classList.add('active');
                document.getElementById('view-games').classList.add('active');
            } else if (target === 'proxy') {
                document.querySelector('.menu-btn:nth-child(2)').classList.add('active');
                document.getElementById('view-proxy').classList.add('active');
            }
        }

        function launchGame(name, targetUrl) {
            document.getElementById('view-games').classList.remove('active');
            
            const runtime = document.getElementById('game-runtime');
            runtime.classList.add('active');
            
            document.getElementById('runtime-title').innerText = name;
            document.getElementById('runtime-iframe').src = targetUrl;
        }

        function exitGame() {
            const iframe = document.getElementById('runtime-iframe');
            iframe.src = 'about:blank';
            document.getElementById('game-runtime').classList.remove('active');
            document.getElementById('view-games').classList.add('active');
        }

        function executeProxy() {
            let query = document.getElementById('proxy-url').value.trim();
            if (!query) return;

            if (!query.startsWith('http://') && !query.startsWith('https://')) {
                if (query.includes('.') && !query.includes(' ')) {
                    query = 'https://' + query;
                } else {
                    query = 'https://www.google.com/search?q=' + encodeURIComponent(query);
                }
            }

            document.getElementById('proxy-iframe').src = scramjetBase + query;
        }
    </script>
</body>
</html>
