<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saltzy</title>
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-card: #334155;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        sidebar {
            width: 260px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .logo-icon {
            font-size: 28px;
            background: var(--bg-card);
            padding: 8px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .nav-links {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--text-muted);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            text-align: left;
            width: 100%;
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            background-color: var(--bg-card);
            color: var(--text-main);
        }

        .nav-item.active {
            background-color: var(--accent);
            color: var(--bg-base);
            font-weight: 600;
        }

        .sidebar-footer {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        /* Main Content */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-base);
        }

        .tab-content {
            display: none;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
            padding: 32px;
        }

        .tab-content.active {
            display: flex;
        }

        /* Header titles inside views */
        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .view-title {
            font-size: 24px;
            font-weight: 700;
        }

        /* Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .game-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .game-thumb {
            height: 130px;
            background-color: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .game-info {
            padding: 16px;
        }

        .game-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .game-desc {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Active Game Player View */
        #game-player-view {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        #game-player-view.active {
            display: flex;
        }

        .game-player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
        }

        .back-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .back-btn:hover {
            background: var(--border);
        }

        .game-iframe-container {
            flex-grow: 1;
            position: relative;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .game-iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Fallback message overlay if iframe refuses connection */
        .iframe-fallback {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-base);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 20px;
            text-align: center;
            z-index: 2;
        }

        .external-launch-btn {
            background: var(--accent);
            color: var(--bg-base);
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }
        .external-launch-btn:hover {
            background: var(--accent-hover);
        }

        /* Proxy Browser View */
        .browser-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .browser-input {
            flex-grow: 1;
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 16px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .browser-input:focus {
            border-color: var(--accent);
        }

        .browser-go-btn {
            background-color: var(--accent);
            color: var(--bg-base);
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .browser-go-btn:hover {
            background-color: var(--accent-hover);
        }

        .browser-frame-container {
            flex-grow: 1;
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
        }

        .browser-frame-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <sidebar>
        <div>
            <div class="logo-area">
                <div class="logo-icon">🧂</div>
                <div class="logo-text">Saltzy</div>
            </div>
            <div class="nav-links">
                <button class="nav-item active" onclick="switchTab('games')">🎮 Games</button>
                <button class="nav-item" onclick="switchTab('proxy')">🌐 Browser Proxy</button>
            </div>
        </div>
        <div class="sidebar-footer">
            Saltzy v1.0
        </div>
    </sidebar>

    <!-- Main Section -->
    <main>
        <!-- Games Tab -->
        <div id="tab-games" class="tab-content active">
            <div class="view-header">
                <div class="view-title">Featured Games</div>
            </div>
            <div class="games-grid">
                <div class="game-card" onclick="openGame('Deltarune', 'https://mollomm1.github.io/test/')">
                    <div class="game-thumb">❤️</div>
                    <div class="game-info">
                        <div class="game-name">Deltarune</div>
                        <div class="game-desc">Chapters 1-5 web port</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- In-App Game Player View (Hidden by default until a game is clicked) -->
        <div id="game-player-view">
            <div class="game-player-header">
                <div id="active-game-title" style="font-weight: 600; font-size: 16px;">Game</div>
                <button class="back-btn" onclick="closeGame()">← Back to Games</button>
            </div>
            <div class="game-iframe-container">
                <!-- Fallback safety message container in case security restrictions block embedding -->
                <div class="iframe-fallback" id="iframe-fallback">
                    <h3 id="fallback-title">Loading Game...</h3>
                    <p style="color: var(--text-muted); max-width: 400px; font-size: 14px;">If the game frame stays blank, the destination site prevents being embedded directly due to security policies.</p>
                    <a id="fallback-link" href="#" target="_blank" class="external-launch-btn">Open in Full Tab</a>
                </div>
                <iframe id="game-iframe" src="" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups"></iframe>
            </div>
        </div>

        <!-- Browser Proxy Tab -->
        <div id="tab-proxy" class="tab-content">
            <div class="view-header">
                <div class="view-title">Web Proxy Browser</div>
            </div>
            <div class="browser-toolbar">
                <input type="text" id="proxy-url-input" class="browser-input" placeholder="Enter URL (e.g., https://www.google.com)">
                <button class="browser-go-btn" onclick="loadProxyUrl()">Go</button>
            </div>
            <div class="browser-frame-container">
                <iframe id="proxy-iframe" src="about:blank"></iframe>
            </div>
        </div>
    </main>

    <script>
        function switchTab(tabName) {
            // Close game player if open
            document.getElementById('game-player-view').classList.remove('active');
            
            // Toggle tab buttons
            const buttons = document.querySelectorAll('.nav-item');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            // Hide all tab contents
            const tabs = document.querySelectorAll('.tab-content');
            tabs.forEach(tab => tab.classList.remove('active'));

            if (tabName === 'games') {
                buttons[0].classList.add('active');
                document.getElementById('tab-games').classList.add('active');
            } else if (tabName === 'proxy') {
                buttons[1].classList.add('active');
                document.getElementById('tab-proxy').classList.add('active');
            }
        }

        function openGame(name, url) {
            // Hide games list view
            document.getElementById('tab-games').classList.remove('active');
            
            // Show game player view
            const playerView = document.getElementById('game-player-view');
            playerView.classList.add('active');
            
            document.getElementById('active-game-title').innerText = name;
            document.getElementById('fallback-title').innerText = 'Loading ' + name + '...';
            
            const fallbackLink = document.getElementById('fallback-link');
            fallbackLink.href = url;
            
            const iframe = document.getElementById('game-iframe');
            iframe.src = url;

            // Give it 3 seconds, if it's still loading or blocked, make sure fallback is visible/accessible
            setTimeout(() => {
                document.getElementById('iframe-fallback').style.display = 'flex';
            }, 500);

            // Hide fallback automatically if iframe manages to load content
            iframe.onload = function() {
                try {
                    // If accessible or loaded
                    document.getElementById('iframe-fallback').style.display = 'none';
                } catch(e) {
                    // stays visible with the manual button if blocked by CORS/X-Frame
                }
            };
        }

        function closeGame() {
            const iframe = document.getElementById('game-iframe');
            iframe.src = 'about:blank'; // Stop audio/game process
            document.getElementById('game-player-view').classList.remove('active');
            document.getElementById('tab-games').classList.add('active');
        }

        function loadProxyUrl() {
            let input = document.getElementById('proxy-url-input').value.trim();
            if (!input) return;
            
            if (!input.startsWith('http://') && !input.startsWith('https://')) {
                input = 'https://' + input;
            }
            
            document.getElementById('proxy-iframe').src = input;
        }
    </script>
</body>
</html>
